name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libvulkan-dev \
            libyuv-dev \
            libsdl2-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Build SDL3
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL3-build
          sudo cmake --install /tmp/SDL3-build
          sudo ldconfig

      - name: Verify Linux headers
        run: |
          test -f /usr/include/vulkan/vulkan.h
          test -f /usr/local/include/SDL3/SDL.h

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', '**/*.zig') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Build
        run: zig build

      - name: Zig tests
        run: zig build test

      - name: Python tests
        run: |
          python3 scripts/katzensteg/test_bootstrap_external_projects.py
          python3 scripts/katzensteg/test_env_scrub.py
          python3 scripts/katzensteg/test_image_fastpath_portable.py
          python3 scripts/katzensteg/test_katzensteg_banner.py
          python3 scripts/katzensteg/test_launcher_target.py
          python3 scripts/katzensteg/test_injected_io.py
          python3 scripts/katzensteg/test_embed_render_batches.py
          python3 scripts/katzensteg/test_headless_wm.py
          python3 scripts/katzensteg/test_wm_placeholder_host.py
          python3 scripts/katzensteg/test_linux_preload_exports.py
          python3 scripts/katzensteg/test_no_preload_stderr.py
          python3 scripts/katzensteg/test_summarize_review_permissions.py
          python3 scripts/katzensteg/test_verify_review_posted.py
          python3 scripts/katzensteg/test_vulkan_linux_wiring.py

      - name: Prepare optional Jackstay dependency
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          python3 scripts/katzensteg/prepare_jackstay.py --prefix /tmp/ks-jackstay

      - name: Build and test Jackstay connectors
        run: |
          zig build -Djackstay=true -Djackstay-prefix=/tmp/ks-jackstay
          zig build test -Djackstay=true -Djackstay-prefix=/tmp/ks-jackstay
          python3 scripts/katzensteg/test_jackstay.py
          git clone --no-checkout https://github.com/flotilla-org/jackstay.git /tmp/ks-jackstay-reference
          git -C /tmp/ks-jackstay-reference checkout --detach "$(python3 -c 'import json; print(json.load(open("profiles/jackstay-dependency.json"))["revision"])')"
          # ABI 0.7 viewer fixture leaves SDL union fields uninitialized on GCC.
          git -C /tmp/ks-jackstay-reference apply "$GITHUB_WORKSPACE/scripts/katzensteg/fixtures/jackstay-viewer-self-test.patch"
          cmake -S /tmp/ks-jackstay-reference/tools/capture-viewer-sdl -B /tmp/ks-reference-viewer \
            -DJACKSTAY_LIB=/tmp/ks-jackstay/lib/libjackstay.so \
            -DJACKSTAY_INCLUDE_DIR=/tmp/ks-jackstay/include
          cmake --build /tmp/ks-reference-viewer --target capture-viewer-sdl capture-input-source
          KATZENSTEG_JACKSTAY_PREFIX=/tmp/ks-jackstay \
            JACKSTAY_REFERENCE_VIEWER=/tmp/ks-reference-viewer/capture-viewer-sdl \
            JACKSTAY_REFERENCE_SOURCE=/tmp/ks-reference-viewer/capture-input-source \
            python3 scripts/katzensteg/test_jackstay_input.py
          python3 scripts/katzensteg/test_injected_io.py

  claude-plugin:
    name: Claude plugin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # TS tests require 22.18+ for type stripping enabled by default.
          node-version: 22
      - name: Test host parsing, layout and placeholders
        run: node --test tools/claude-code-plugin/hooks/*.test.ts
