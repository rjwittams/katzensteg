<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Luchs Static Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f2f6f8;
        font: 20px system-ui, sans-serif;
      }
      main {
        padding: 32px;
        border: 1px solid #4aa3df;
      }
      main::after {
        content: "";
        display: block;
        width: 100%;
        height: 4px;
        margin-top: 18px;
        background: #4aa3df;
        animation: pulse 1s linear infinite;
        transform-origin: left center;
      }
      @keyframes pulse {
        from { transform: scaleX(0.15); }
        to { transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <main>Luchs static HTML fixture</main>
  </body>
</html>
